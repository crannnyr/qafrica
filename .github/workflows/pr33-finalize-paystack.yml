name: PR33 finalize Paystack identity

on:
  push:
    branches:
      - feature/china-import-promotions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add customer identity to Paystack
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('src/pages/recommendations/ImportCheckoutSheet.tsx')
          s = p.read_text()
          old = """        email: customer.email,\n        amount: toKobo(data.total_ngn),\n        reference,\n        metadata:"""
          new = """        email: customer.email,\n        amount: toKobo(data.total_ngn),\n        reference,\n        customerName: customer.full_name,\n        phone: whatsapp.trim(),\n        metadata:"""
          if old not in s:
              raise SystemExit('Paystack identity marker not found')
          p.write_text(s.replace(old, new, 1))
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/pr33-finalize-paystack.yml'], check=True)
          subprocess.run(['git', 'add', 'src/pages/recommendations/ImportCheckoutSheet.tsx'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Send China Import customer identity to Paystack'], check=True)
          subprocess.run(['git', 'push'], check=True)
