name: finish-china-import-promo
on:
  push:
    branches:
      - feature/china-import-promotions
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply promo checkout integration
        env:
          BRANCH: feature/china-import-promotions
        run: |
          python3 <<'PY'
          from pathlib import Path

          checkout = Path('src/pages/recommendations/ImportCheckoutSheet.tsx')
          s = checkout.read_text()
          s = s.replace("import ImportQtyControl from '@/components/ImportQtyControl';", "import ImportQtyControl from '@/components/ImportQtyControl';\nimport ChinaImportPromoCode, { type ChinaImportPromotionQuote } from './ChinaImportPromoCode';")
          s = s.replace("  const [result, setResult] = useState<{ code: string; bank?: any; order_id?: string } | null>(null);", "  const [result, setResult] = useState<{ code: string; bank?: any; order_id?: string } | null>(null);\n  const [promoCode, setPromoCode] = useState('');\n  const [promoQuote, setPromoQuote] = useState<ChinaImportPromotionQuote | null>(null);")
          s = s.replace("  const total = subtotal + (shippingSettings.chargeShippingAtCheckout ? shippingTotal : 0);\n\n  // Paystack / manual selection", "  const total = subtotal + (shippingSettings.chargeShippingAtCheckout ? shippingTotal : 0);\n  const promoDiscountNgn = Math.min(Math.max(Number(promoQuote?.discount_amount_ngn ?? 0), 0), total);\n  const discountedTotal = Math.max(total - promoDiscountNgn, 0);\n\n  // Paystack / manual selection")
          s = s.replace("  const paystackAllowed = paystackEnabled && total < shippingSettings.paystackManualThresholdNgn;\n  const manualAllowed = manualTransferEnabled && total >= shippingSettings.paystackManualThresholdNgn;", "  const paystackAllowed = paystackEnabled && discountedTotal < shippingSettings.paystackManualThresholdNgn;\n  const manualAllowed = manualTransferEnabled && discountedTotal >= shippingSettings.paystackManualThresholdNgn;")
          s = s.replace("  const canSubmit = whatsapp.trim() && cart.length > 0 && addressComplete && perItemShippingComplete &&\n    (cart.length > 1 ? true : !!shippingMethod);", "  const canSubmit = whatsapp.trim() && cart.length > 0 && addressComplete && perItemShippingComplete &&\n    (cart.length > 1 ? true : !!shippingMethod) && (!promoCode.trim() || !!promoQuote?.promotion_id);")
          s = s.replace("          payment_method: paymentMethod,\n          items:", "          payment_method: paymentMethod,\n          promo_code: promoQuote?.code ?? null,\n          items:")
          s = s.replace("        amountLabel={fmt(total)}", "        amountLabel={fmt(discountedTotal)}")
          marker = "        <div className=\"bg-gray-50 rounded-xl p-3.5 space-y-1.5\">"
          promo_block = """        <ChinaImportPromoCode
          customerId={customer.id}
          orderSubtotalNgn={subtotal}
          value={promoCode}
          onChange={value => { setPromoCode(value); if (!value.trim()) setPromoQuote(null); }}
          onApplied={setPromoQuote}
        />

"""
          if promo_block not in s:
              s = s.replace(marker, promo_block + marker)
          old_total = "          <div className=\"flex justify-between text-xs font-bold text-gray-900 pt-1.5 border-t border-gray-200\"><span>Total</span><span className=\"text-orange-500\">{fmt(total)}</span></div>"
          new_total = """          {promoDiscountNgn > 0 && (
            <div className=\"flex justify-between text-xs text-emerald-600\">
              <span>Promo discount{promoQuote?.code ? ` (${promoQuote.code})` : ''}</span>
              <span className=\"font-semibold\">−{fmt(promoDiscountNgn)}</span>
            </div>
          )}
          <div className=\"flex justify-between text-xs font-bold text-gray-900 pt-1.5 border-t border-gray-200\"><span>Total</span><span className=\"text-orange-500\">{fmt(discountedTotal)}</span></div>"""
          if old_total not in s:
              raise SystemExit('checkout total marker not found')
          s = s.replace(old_total, new_total)
          s = s.replace("{isProcessing ? 'Processing…' : `Pay ${fmt(total)}`}", "{isProcessing ? 'Processing…' : `Pay ${fmt(discountedTotal)}`}")
          s = s.replace("{cart[0].volume_cbm} cbm", "Volume: {cart[0].volume_cbm}")
          s = s.replace("{item.volume_cbm != null && `${item.volume_cbm} cbm`}", "{item.volume_cbm != null && `Volume: ${item.volume_cbm}`}")
          checkout.write_text(s)

          fn = Path('supabase/functions/china-import/index.ts')
          s = fn.read_text()
          s = s.replace("        delivery_mode, pickup_station_id, address_id,\n      } = body", "        delivery_mode, pickup_station_id, address_id, promo_code,\n      } = body")
          old = """      const shippingNgn = shippingSettings.charge_shipping_at_checkout ? discountedShippingNgn : 0
      const jumiaFeeNgn = delivery_type === 'to_qafrica' ? pricedItems.reduce((s: number, i: any) => s + 200 * Number(i.quantity ?? 0), 0) : 0
      const totalNgn = subtotalNgn + jumiaFeeNgn + shippingNgn
"""
          new = """      const shippingNgn = shippingSettings.charge_shipping_at_checkout ? discountedShippingNgn : 0
      const jumiaFeeNgn = delivery_type === 'to_qafrica' ? pricedItems.reduce((s: number, i: any) => s + 200 * Number(i.quantity ?? 0), 0) : 0
      const baseTotalNgn = subtotalNgn + jumiaFeeNgn + shippingNgn

      let promoDiscountNgn = 0
      let appliedPromotion: any = null
      if (typeof promo_code === 'string' && promo_code.trim()) {
        const { data: promoRows, error: promoError } = await supabase.rpc('validate_china_import_promotion', {
          p_code: promo_code.trim().toUpperCase(),
          p_customer_id: customer_id,
          p_order_subtotal_ngn: subtotalNgn,
        })
        if (promoError) return json({ error: 'Could not validate promo code. Please try again.' }, 500)
        appliedPromotion = promoRows?.[0] ?? null
        if (!appliedPromotion?.promotion_id || Number(appliedPromotion.discount_amount_ngn ?? 0) <= 0) {
          return json({ error: appliedPromotion?.message ?? 'This promo code is not valid.' }, 409)
        }
        promoDiscountNgn = Math.min(Number(appliedPromotion.discount_amount_ngn), baseTotalNgn)
      }
      const totalNgn = Math.max(baseTotalNgn - promoDiscountNgn, 0)
"""
          if old not in s:
              raise SystemExit('checkout total backend marker not found')
          s = s.replace(old, new)
          s = s.replace("          subtotal_ngn: subtotalNgn, jumia_fee_ngn: jumiaFeeNgn, total_ngn: totalNgn,", "          subtotal_ngn: subtotalNgn, jumia_fee_ngn: jumiaFeeNgn, total_ngn: totalNgn,\n          promo_code: appliedPromotion?.code ?? null, promo_discount_ngn: promoDiscountNgn, promo_id: appliedPromotion?.promotion_id ?? null,")
          helper_marker = "async function incrementUnitsSold(supabase: any, items: any[]) {"
          helper = """async function recordChinaImportPromotionRedemption(supabase: any, order: any) {
  if (!order?.promo_id || !order?.promo_code || Number(order?.promo_discount_ngn ?? 0) <= 0) return
  const { error } = await supabase.from('china_import_promotion_redemptions').insert({
    promotion_id: order.promo_id, customer_id: order.user_id, order_id: order.id,
    code: order.promo_code, discount_amount_ngn: Number(order.promo_discount_ngn),
    order_subtotal_ngn: Number(order.subtotal_ngn ?? 0),
  })
  if (!error) await supabase.rpc('increment_china_import_promotion_usage', { p_promotion_id: order.promo_id })
  else if (error.code !== '23505') console.warn('[china-import] promotion redemption failed:', error)
}

"""
          if helper not in s:
              s = s.replace(helper_marker, helper + helper_marker)
          s = s.replace("select('payment_status, items').eq('id', order_id).single()", "select('payment_status, items, promo_id, promo_code, promo_discount_ngn, user_id, subtotal_ngn').eq('id', order_id).single()")
          s = s.replace("        await sendOrderConfirmedEmail(supabase, order)\n        await advanceOrderStatus(supabase, order_id, 'confirmed')", "        await sendOrderConfirmedEmail(supabase, order)\n        await recordChinaImportPromotionRedemption(supabase, order)\n        await advanceOrderStatus(supabase, order_id, 'confirmed')")
          claim_return = "      if (updateErr) return json({ error: updateErr.message }, 500)\n      return json({ success: true })"
          claim_replacement = "      if (updateErr) return json({ error: updateErr.message }, 500)\n      if (updated) { const { data: paidOrder } = await supabase.from('china_import_orders').select('id, user_id, promo_id, promo_code, promo_discount_ngn, subtotal_ngn').eq('id', order_id).single(); if (paidOrder) await recordChinaImportPromotionRedemption(supabase, paidOrder) }\n      return json({ success: true })"
          if claim_return in s:
              s = s.replace(claim_return, claim_replacement, 1)
          fn.write_text(s)

          mig = Path('supabase/migrations/20261001000000_china_import_promo_checkout.sql')
          mig.write_text("""-- Persist the China Import promo attached to an order so the server can redeem it only after payment succeeds.
alter table public.china_import_orders add column if not exists promo_id uuid references public.china_import_promotions(id);
alter table public.china_import_orders add column if not exists promo_code text;
alter table public.china_import_orders add column if not exists promo_discount_ngn numeric(14,2) not null default 0;

create or replace function public.increment_china_import_promotion_usage(p_promotion_id uuid)
returns void
language sql
security definer
set search_path = public
as $$
  update public.china_import_promotions
  set usage_count = usage_count + 1, updated_at = now()
  where id = p_promotion_id;
$$;

grant execute on function public.increment_china_import_promotion_usage(uuid) to service_role;
""")
          Path('.github/workflows/finish-china-import-promo.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/recommendations/ImportCheckoutSheet.tsx supabase/functions/china-import/index.ts supabase/migrations/20261001000000_china_import_promo_checkout.sql .github/workflows/finish-china-import-promo.yml
          git diff --cached --check
          git commit -m "feat: connect China Import promo codes to checkout"
          git push origin "$BRANCH"
