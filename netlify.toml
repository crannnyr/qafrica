[build]
  command = "npm run build"
  publish = "dist"

# Inject product metadata into HTML before link-preview crawlers read it.
[[edge_functions]]
  function = "import-meta"
  path = "/recommendations"

[[edge_functions]]
  function = "import-meta"
  path = "/recommendations/*"

[[edge_functions]]
  function = "import-meta"
  path = "/stores-v2/product/*"

[[edge_functions]]
  function = "import-meta"
  path = "/*/product/*"

[[edge_functions]]
  function = "root-marketplace-redirect"
  path = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200